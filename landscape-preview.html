<style>
*{box-sizing:border-box}

button:active{transform:translateY(2px)}button:focus-visible,a:focus-visible{outline:3px solid white}
.group{display:flex}.group button:first-child{border-radius:8px 0 0 8px}.group button:last-child{border-radius:0 8px 8px 0}.group [aria-pressed=true]{background:#143e26;color:#ffe687}
.gold,.amber{color:#442a03;text-shadow:none;background:linear-gradient(#ffd672,#eba52d);border-color:#e8a42c;box-shadow:0 3px #895709}.purple{background:linear-gradient(#b03cca,#77339a);border-color:#ac59c3;box-shadow:0 3px #49205b}
section{min-width:0;display:flex;flex-direction:column;justify-content:space-between}.table{container-type:inline-size}
.rows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6%;align-items:start;max-width:min(100%,117svh);margin:auto}
.lower{margin-top:8px;padding-bottom:min(19cqw,16vh)}.top{direction:rtl}.waste,.pile,.slot{position:relative;aspect-ratio:149/213}.slot{display:grid;place-items:center;border:1px solid #e7ffcb44;border-radius:7%;background:#051e163b;color:#ecffe24f;font:clamp(18px,3vw,40px) Georgia}
img{width:100%;display:block;filter:drop-shadow(0 2px 2px #001a18aa)}.pile img,.waste img{position:absolute}.pile img{top:calc(var(--i)*min(1.2cqw,1.4vh) + var(--j)*min(4.2cqw,3.6vh))}.waste img{inset-inline-start:calc(var(--fan)*23%)}
aside,footer{align-self:start;background:#092c1edc;border:1px solid #a6af556d;border-radius:13px}
aside{padding:15px 14px}aside h2{font-size:15px;margin:0}aside small{float:right;color:#adbfad}.stats,footer{display:flex;justify-content:space-around;text-align:center;gap:5px}.stats{margin:14px 0} .stats span,footer span{display:grid;color:#e2ece1;font-size:12px}.stats b,footer b{font-size:20px;color:#ffd25a;font-variant-numeric:tabular-nums}
.summary{border-top:1px solid #ffffff2c;padding-top:10px;display:flex;justify-content:space-between;color:#daebd3}.summary b{color:#ffdb81}
footer{align-self:stretch;padding:7px 0}dialog{border:1px solid #829577;border-radius:16px;padding:24px;background:#173d30;color:white}dialog::backdrop{background:#05171399}dialog h2{margin-top:0}
.flash{outline:3px solid #ffdb5d;outline-offset:1px}.picked{filter:brightness(1.22)}
@media(max-width:960px){main{grid-template-columns:1fr}aside{display:none}}
@media(max-width:600px){header{height:46px}main{min-height:calc(100svh - 46px);padding-inline:5px}h1{display:none}nav{gap:5px}button{padding:6px 9px}header strong{font-size:21px}}
@media(max-height:500px) and (orientation:landscape){header{height:32px}header strong{font-size:19px}main{min-height:calc(100svh - 32px);grid-template-columns:1fr}aside{display:none}nav{padding:5px 0}button{padding:3px 10px}.rows{max-width:103svh}.lower{padding-bottom:13vh}footer{padding:2px}footer span{display:block}footer b{margin-right:6px;font-size:15px}}
</style>

<dialog id="options"><h2>牌桌设置</h2><label><input type="checkbox" id="mirror"> 备牌放在左侧</label><form method="dialog"><p><button>完成</button></p></form></dialog>
<dialog id="goals"><h2>每日目标 · 示例</h2><p>✓ 完成一局游戏</p><p>移入收牌堆　8 / 15</p><p>赢得两局　1 / 2</p><form method="dialog"><button>关闭</button></form></dialog>
<script>
const get=id=>document.getElementById(id);
get('settings').onclick=()=>get('options').showModal();
get('daily').onclick=()=>get('goals').showModal();
get('mirror').onchange=e=>document.querySelector('.top').style.direction=e.target.checked?'ltr':'rtl';
const modes=document.querySelectorAll('[data-mode]');
function drawMode(mode){
 for(const button of modes)button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
 document.querySelectorAll('.waste img').forEach((card,index)=>{
  card.style.display=mode==='1' && index<2?'none':'block';
  card.style.setProperty('--fan',mode==='1'?0:index);
 });
}
for(const button of modes)button.onclick=()=>drawMode(button.dataset.mode);
const columns=document.querySelectorAll('.pile');
const source=columns[3], target=columns[0];
const queen=target.children[1];
const king=source.lastElementChild;
function highlight(active){
 queen.classList.toggle('flash',active);
 king.classList.toggle('flash',active);
}
function reset(){
 highlight(false);
 while(king.nextElementSibling){
  const card=king.nextElementSibling;
  card.style.setProperty('--i',0);
  card.style.setProperty('--j',target.children.length);
  target.append(card);
 }
}
function move(){
 if(queen.parentElement!==target)return;
 highlight(false);
 for(const card of Array.from(target.children).slice(1)){
  card.style.setProperty('--i',3);
  card.style.setProperty('--j',source.children.length-3);
  source.append(card);
 }
}
get('new').onclick=reset;
get('undo').onclick=reset;
get('hint').onclick=()=>{reset();highlight(true);};
queen.onclick=move;
</script></html>
